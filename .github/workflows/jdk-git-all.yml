name: Download and Commit Oracle JDKs (x64 / x86-64)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Oracle JDK versions (e.g., 8u411,11.0.24,17.0.12,21.0.7,25.0.1)"
        required: true
        default: "8u411,11.0.24,17.0.12,21.0.7,25.0.1"

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse versions
        id: parse
        run: |
          versions=$(echo "${{ github.event.inputs.versions }}" | tr ',' ' ')
          echo "versions=$versions" >> $GITHUB_OUTPUT

      - name: Download Oracle JDK files (x64 / x86-64)
        run: |
          for ver in ${{ steps.parse.outputs.versions }}; do
            echo "Processing Oracle JDK $ver ..."

            base_url="https://download.oracle.com/otn-pub/java/jdk/${ver}/"

            echo "Fetching file list from $base_url ..."
            html=$(curl -s -b "oraclelicense=accept-securebackup-cookie" -H "Cookie: oraclelicense=accept-securebackup-cookie" "$base_url")

            # Extract all files containing x64 or x86-64
            files=$(echo "$html" | grep -Eo 'href="jdk-[^"]*(x64|x86-64)[^"]+\.(zip|exe|msi|tar\.gz|dmg)"' | sed 's/href="//' | sed 's/"//')

            for file in $files; do
              # Detect OS from filename
              if [[ $file == *windows* ]]; then
                os="windows"
              elif [[ $file == *linux* ]]; then
                os="linux"
              elif [[ $file == *macos* ]]; then
                os="macos"
              else
                os="other"
              fi

              echo "Downloading $file ..."
              mkdir -p "jdk/$ver/$os"
              curl -L -b "oraclelicense=accept-securebackup-cookie" \
                   -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                   -o "jdk/$ver/$os/$file" "$base_url/$file"
            done
          done

      - name: Commit JDKs into repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jdk/
          git commit -m "Add Oracle JDK versions: ${{ github.event.inputs.versions }} (x64 / x86-64, all OS files)"
          git push
