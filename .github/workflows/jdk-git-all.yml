name: Download and Commit Oracle JDKs (Separate x64 and x86-64)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Oracle JDK versions (e.g., 8u471,11.0.29,17.0.17,21.0.9,25.0.1)"
        required: true
        default: "8u471,11.0.29,17.0.17,21.0.9,25.0.1"

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse versions
        id: parse
        run: |
          versions=$(echo "${{ github.event.inputs.versions }}" | tr ',' ' ')
          echo "versions=$versions" >> $GITHUB_OUTPUT

      - name: Download Oracle JDK files (arch-separated)
        run: |
          for ver in ${{ steps.parse.outputs.versions }}; do
            echo "Processing Oracle JDK $ver ..."

            base_url="https://download.oracle.com/otn-pub/java/jdk/${ver}/"

            echo "Fetching file list from $base_url ..."
            html=$(curl -s -b "oraclelicense=accept-securebackup-cookie" -H "Cookie: oraclelicense=accept-securebackup-cookie" "$base_url")

            # Separate lists for architectures
            x64_files=$(echo "$html" | grep -Eo 'href="jdk-[^"]*x64[^"]+\.(zip|exe|msi|tar\.gz|dmg)"' | sed 's/href="//' | sed 's/"//')
            x86_64_files=$(echo "$html" | grep -Eo 'href="jdk-[^"]*x86-64[^"]+\.(zip|exe|msi|tar\.gz|dmg)"' | sed 's/href="//' | sed 's/"//')

            # Function to download files into folder
            download_files() {
              arch=$1
              files_list=$2
              for file in $files_list; do
                # Detect OS
                if [[ $file == *windows* ]]; then
                  os="windows"
                elif [[ $file == *linux* ]]; then
                  os="linux"
                elif [[ $file == *macos* ]]; then
                  os="macos"
                else
                  os="other"
                fi

                mkdir -p "jdk/$ver/$arch/$os"
                echo "Downloading $file for $arch/$os ..."
                curl -L -b "oraclelicense=accept-securebackup-cookie" \
                     -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                     -o "jdk/$ver/$arch/$os/$file" "$base_url/$file"
              done
            }

            # Download x64 and x86-64 files separately
            download_files "x64" "$x64_files"
            download_files "x86-64" "$x86_64_files"

          done

      - name: Commit JDKs into repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jdk/
          git commit -m "Add Oracle JDK versions: ${{ github.event.inputs.versions }} (arch-separated x64 and x86-64)"
          git push
