name: Download and Commit Oracle JDKs (Dynamic Versions)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated exact Oracle JDK version strings (e.g. 8u411-b09,11.0.24+8,17.0.12+7,21.0.7+7)"
        required: true
        default: "8u411-b09,11.0.24+8,17.0.12+7,21.0.7+7"

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse versions
        id: parse
        run: |
          versions=$(echo "${{ github.event.inputs.versions }}" | tr ',' ' ')
          echo "versions=$versions" >> $GITHUB_OUTPUT

      - name: Download Oracle JDKs for all OS
        run: |
          for ver in ${{ steps.parse.outputs.versions }}; do
            echo "Processing Oracle JDK $ver ..."

            # Determine major version for folder structure
            if [[ "$ver" == 8* ]]; then
              major=8
            elif [[ "$ver" == 11* ]]; then
              major=11
            elif [[ "$ver" == 17* ]]; then
              major=17
            elif [[ "$ver" == 21* ]]; then
              major=21
            else
              echo "Unsupported major JDK version in $ver"
              exit 1
            fi

            # Construct dynamic download URLs
            WIN_URL="https://download.oracle.com/otn-pub/java/jdk/${ver}/jdk-${ver}_windows-x64_bin.zip"
            LINUX_URL="https://download.oracle.com/otn-pub/java/jdk/${ver}/jdk-${ver}_linux-x64_bin.tar.gz"
            MAC_URL="https://download.oracle.com/otn-pub/java/jdk/${ver}/jdk-${ver}_macos-x64_bin.dmg"

            echo "Downloading $ver for Windows, Linux, macOS..."

            mkdir -p "jdk/$major/windows" "jdk/$major/linux" "jdk/$major/macos"

            curl -L -b "oraclelicense=accept-securebackup-cookie" \
                 -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                 -o "jdk/$major/windows/jdk-${ver}_windows-x64_bin.zip" "$WIN_URL"

            curl -L -b "oraclelicense=accept-securebackup-cookie" \
                 -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                 -o "jdk/$major/linux/jdk-${ver}_linux-x64_bin.tar.gz" "$LINUX_URL"

            curl -L -b "oraclelicense=accept-securebackup-cookie" \
                 -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                 -o "jdk/$major/macos/jdk-${ver}_macos-x64_bin.dmg" "$MAC_URL"

          done

      - name: Commit JDKs into repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jdk/
          git commit -m "Add Oracle JDK versions: ${{ github.event.inputs.versions }} (Win/Linux/macOS)"
          git push
