name: Download and Commit Oracle JDK 21.0.7 (Windows x64)

on:
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # REQUIRED for pushing to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required so we can commit back

      - name: Download Oracle JDK 21.0.7 for Windows x64
        run: |
          JDK_URL="https://download.oracle.com/otn-pub/java/jdk/21.0.7+7/2e923413a8bb42a4b77fa1f21dcb40f2/jdk-21.0.7_windows-x64_bin.zip"

          echo "Downloading Oracle JDK..."
          curl -L -b "oraclelicense=accept-securebackup-cookie" \
               -H "Cookie: oraclelicense=accept-securebackup-cookie" \
               -o jdk-21.0.7_windows-x64.zip \
               "$JDK_URL"

      - name: Commit ZIP into repo
        run: |
          mkdir -p jdk
          mv jdk-21.0.7_windows-x64.zip jdk/

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add jdk/jdk-21.0.7_windows-x64.zip
          git commit -m "Add Oracle JDK 21.0.7 Windows x64 ZIP"
          git push
