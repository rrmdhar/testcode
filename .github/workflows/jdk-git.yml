name: Download and Commit Oracle JDKs (Win, Linux, macOS)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Oracle JDK versions to download (8,11,17,21)"
        required: false
        default: "8,11,17,21"

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse versions
        id: parse
        run: |
          versions=$(echo "${{ github.event.inputs.versions }}" | tr ',' ' ')
          echo "versions=$versions" >> $GITHUB_OUTPUT

      - name: Download Oracle JDKs for all OS
        run: |
          for ver in ${{ steps.parse.outputs.versions }}; do
            echo "Processing Oracle JDK $ver ..."

            case $ver in
              8)
                WIN_URL="https://download.oracle.com/otn-pub/java/jdk/8u411-b09/jdk-8u411-windows-x64.zip"
                LINUX_URL="https://download.oracle.com/otn-pub/java/jdk/8u411-b09/jdk-8u411-linux-x64.tar.gz"
                MAC_URL="https://download.oracle.com/otn-pub/java/jdk/8u411-b09/jdk-8u411-macosx-x64.dmg"
                ;;

              11)
                WIN_URL="https://download.oracle.com/otn-pub/java/jdk/11.0.24+8/aa18e27f67aa4db3af51d119dadd2f96/jdk-11.0.24_windows-x64_bin.zip"
                LINUX_URL="https://download.oracle.com/otn-pub/java/jdk/11.0.24+8/aa18e27f67aa4db3af51d119dadd2f96/jdk-11.0.24_linux-x64_bin.tar.gz"
                MAC_URL="https://download.oracle.com/otn-pub/java/jdk/11.0.24+8/aa18e27f67aa4db3af51d119dadd2f96/jdk-11.0.24_macos-x64_bin.dmg"
                ;;

              17)
                WIN_URL="https://download.oracle.com/otn-pub/java/jdk/17.0.12+7/2264dfa7eac74756a8b9ce477db47955/jdk-17.0.12_windows-x64_bin.zip"
                LINUX_URL="https://download.oracle.com/otn-pub/java/jdk/17.0.12+7/2264dfa7eac74756a8b9ce477db47955/jdk-17.0.12_linux-x64_bin.tar.gz"
                MAC_URL="https://download.oracle.com/otn-pub/java/jdk/17.0.12+7/2264dfa7eac74756a8b9ce477db47955/jdk-17.0.12_macos-x64_bin.dmg"
                ;;

              21)
                WIN_URL="https://download.oracle.com/otn-pub/java/jdk/21.0.7+7/2e923413a8bb42a4b77fa1f21dcb40f2/jdk-21.0.7_windows-x64_bin.zip"
                LINUX_URL="https://download.oracle.com/otn-pub/java/jdk/21.0.7+7/2e923413a8bb42a4b77fa1f21dcb40f2/jdk-21.0.7_linux-x64_bin.tar.gz"
                MAC_URL="https://download.oracle.com/otn-pub/java/jdk/21.0.7+7/2e923413a8bb42a4b77fa1f21dcb40f2/jdk-21.0.7_macos-x64_bin.dmg"
                ;;

              *)
                echo "Unsupported JDK version: $ver"
                exit 1
                ;;
            esac

            # Download all platforms
            echo "Downloading Oracle JDK $ver for Windows, Linux, macOS..."

            mkdir -p jdk/$ver/windows jdk/$ver/linux jdk/$ver/macos

            curl -L -b "oraclelicense=accept-securebackup-cookie" \
                 -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                 -o "jdk/$ver/windows/${WIN_URL##*/}" "$WIN_URL"

            curl -L -b "oraclelicense=accept-securebackup-cookie" \
                 -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                 -o "jdk/$ver/linux/${LINUX_URL##*/}" "$LINUX_URL"

            curl -L -b "oraclelicense=accept-securebackup-cookie" \
                 -H "Cookie: oraclelicense=accept-securebackup-cookie" \
                 -o "jdk/$ver/macos/${MAC_URL##*/}" "$MAC_URL"

          done

      - name: Commit JDKs into repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add jdk/
          git commit -m "Add Oracle JDK versions: ${{ github.event.inputs.versions }} (Win/Linux/macOS)"
          git push
